<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Fast X - احجز</title>
<style>
:root{--bg:#000;--pn:#0d0d0d;--pn2:#181818;--ln:#2c2c2c;--tx:#f4f4f4;--mu:#9a9a9a;--ac:#ff1a1a;--am:#ffb547;--er:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",Tahoma,system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:4px 14px;background:#000;border-bottom:2px solid var(--ac)}
#logo{height:58px;display:block}
button{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
#lg{margin-inline-start:auto;font-weight:700;padding:8px 14px}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 0}
.brand{color:var(--mu);font-size:14px;margin:4px 0 0}
h1{margin:2px 0 4px;font-size:26px}
.sub{color:var(--mu);margin:0 0 16px}
.sec{padding:18px 0 20px;border-top:1px solid var(--ln)}
.sec h2{margin:0;font-size:17px}
label{display:block;margin:14px 0 6px;font-weight:700;font-size:14px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
.ltr{direction:ltr;text-align:start}
html[dir=rtl] .ltr{text-align:right}
.types{display:grid;gap:10px;margin-top:12px}
.t{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:var(--pn);border:2px solid var(--ln);border-radius:12px;text-align:start;user-select:none;transition:border-color .15s,background .15s}
.t:hover{border-color:#5a2222}
.t .ic{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:10px;background:var(--pn2);color:var(--mu);transition:background .15s,color .15s}
.t .ic svg{width:26px;height:26px}
.tn{flex:1;min-width:0}
.tn b{display:block;font-size:16px}
.tn small{color:var(--mu)}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #555;transition:background .15s,border-color .15s}
.t.on{border-color:var(--ac);background:#1a0606}
.t.on .ic{background:var(--ac);color:#fff}
.t.on .dot{border-color:var(--ac);background:var(--ac);box-shadow:inset 0 0 0 4px #1a0606}
.vopts{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 6px}
.vo{flex:1 1 120px;text-align:center;padding:9px 10px;border:2px solid var(--ln);border-radius:10px;background:var(--pn);transition:border-color .15s,background .15s}
.vo b{display:block}
.vo small{color:var(--mu)}
.vo.on{border-color:var(--ac);background:#2a0808}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{padding:10px 6px;text-align:center;border:2px solid var(--ln);border-radius:10px;background:var(--pn);transition:border-color .15s,background .15s}
.chip.on{border-color:var(--ac);background:#2a0808;font-weight:700}
.step{display:flex;direction:ltr;align-items:stretch;gap:8px}
.step button{flex:none;width:52px;padding:0;font-size:22px;line-height:1;border-radius:10px}
.step input{text-align:center;font-weight:700;-moz-appearance:textfield;appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dep{margin:0 0 4px;padding:14px;border:2px solid var(--ac);border-radius:10px;background:#1a0606}
.dep h3{margin:0 0 4px;font-size:16px}
.dep .amt{font-size:22px;font-weight:800;color:var(--am)}
.acc{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding:10px;background:var(--pn2);border-radius:8px}
.acc b{direction:ltr;word-break:break-all}
.acc button{padding:6px 12px;font-size:13px}
.note{color:var(--mu);font-size:13px;text-align:center;margin:12px 0 0}
.bar{position:sticky;bottom:0;margin:12px -14px 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.95);border-top:2px solid var(--ac)}
.bar-in{display:flex;align-items:center;gap:12px}
.tot{flex:none}
.tot small{display:block;color:var(--mu);font-size:12px;line-height:1.3}
.tot b{color:var(--am);font-size:19px}
.err{color:var(--er);font-size:14px;text-align:center}
.err:not(:empty){margin-bottom:8px}
#go{flex:1;padding:14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:800;font-size:16px}
#go:hover{filter:brightness(1.12)}
.empty{text-align:center;margin-top:50px;color:var(--mu)}
@media(max-width:380px){.row{grid-template-columns:1fr}.chips{grid-template-columns:repeat(2,1fr)}.bar-in{flex-wrap:wrap}#go{flex-basis:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
