<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>احجز الآن</title>
<style>
:root{--bg:#000;--pn:#141414;--pn2:#1c1c1c;--ln:#2c2c2c;--tx:#f4f4f4;--mu:#9a9a9a;--ac:#ff1a1a;--ok:#25d366}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{margin:6px 0 2px;font-size:26px;text-align:center}
.sub{color:var(--mu);text-align:center;margin:0 0 18px}
.brand{text-align:center;color:var(--ac);font-weight:800;letter-spacing:1px;font-size:14px}
label{display:block;margin:14px 0 6px;font-weight:700;font-size:14px}
input,select,textarea{width:100%;padding:13px 12px;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:10px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t{background:var(--pn);border:2px solid var(--ln);border-radius:12px;padding:12px;cursor:pointer;text-align:center;user-select:none}
.t b{display:block}.t small{color:var(--mu)}
.t.on{border-color:var(--ac);background:#2a0808}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.est{margin:16px 0 4px;padding:12px;border-radius:12px;background:var(--pn2);display:flex;justify-content:space-between;font-weight:800}
.est span:last-child{color:#ffb547}
button{width:100%;margin-top:14px;padding:16px;border:0;border-radius:12px;background:var(--ok);color:#04210f;font:800 18px inherit;cursor:pointer}
button:disabled{opacity:.5}
.err{color:#ff6b6b;font-size:14px;min-height:20px;margin-top:8px;text-align:center}
.note{color:var(--mu);font-size:13px;text-align:center;margin-top:12px}
.dep{margin-top:14px;padding:14px;border:2px solid var(--ac);border-radius:12px;background:#1a0606}.dep h3{margin:0 0 6px;font-size:16px}.dep .amt{font-size:22px;font-weight:800;color:#ffb547}.acc{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding:10px;background:var(--pn);border-radius:10px}.acc b{direction:ltr;word-break:break-all}.acc button{width:auto;margin:0;padding:6px 12px;font-size:13px;background:#333;color:#fff}.empty{text-align:center;margin-top:60px;color:var(--mu)}
</style></head><body><div class="wrap" id="app"></div>
<script>
(function(){
var app=document.getElementById('app'),C=null;
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
try{var m=location.hash.match(/c=([^&]+)/);if(m)C=JSON.parse(b64(m[1]))}catch(e){}
/* config: n=name, w=whatsapp number (digits, intl), c=currency, t=[[key,label,pricePerHour],...] */
if(!C||!C.w||!C.t||!C.t.length){app.innerHTML='<div class="empty"><h1>الرابط غير مكتمل</h1><p>اطلب من المكان إعادة إرسال كود الحجز.</p></div>';return}
var cur=C.c||'EGP',sel=0,TYPE=C.t;
function pad(n){return n<10?'0'+n:n}
function nowLocal(){var d=new Date(Date.now()+3600000);d.setMinutes(0,0,0);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function minLocal(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
app.innerHTML='<div class="brand">'+esc(C.n||'')+'</div><h1>احجز مكانك</h1><p class="sub">املأ البيانات وهيوصل طلبك على واتساب، وهنأكد معاك الحجز.</p>'
+'<label>اختار النوع</label><div class="types" id="ty">'+TYPE.map(function(t,i){return'<div class="t'+(i?'':' on')+'" data-i="'+i+'"><b>'+esc(t[1])+'</b><small>'+(t[2]?t[2]+' '+esc(cur)+' / ساعة':'')+'</small></div>'}).join('')+'</div>'
+'<label>الاسم</label><input id="nm" autocomplete="name" placeholder="اسمك">'
+'<label>رقم الموبايل</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx">'
+'<div class="row"><div><label>التاريخ والوقت</label><input id="dt" type="datetime-local"></div><div><label>المدة</label><select id="du"><option value="1">ساعة</option><option value="1.5">ساعة ونص</option><option value="2">ساعتين</option><option value="3">3 ساعات</option><option value="4">4 ساعات</option><option value="5">5 ساعات</option></select></div></div>'
+'<label>عدد الأشخاص</label><input id="gs" type="number" min="1" max="30" value="2">'
+'<label>ملاحظات (اختياري)</label><textarea id="nt" rows="2" placeholder="عيد ميلاد، ماتش، أي طلب خاص"></textarea>'
+'<div class="est"><span>التكلفة التقريبية</span><span id="es">-</span></div>'
+(C.d?'<div class="dep"><h3>العربون مطلوب لتأكيد الحجز</h3><div class="amt" id="dp">-</div>'+((C.p&&C.p.length)?'<label style="margin-top:10px">حوّل العربون عن طريق</label><select id="pm">'+C.p.map(function(x,i){return'<option value="'+i+'">'+esc(x[0])+'</option>'}).join('')+'</select><div class="acc" id="ac"></div>':'')+'<p class="note" style="margin:8px 0 0">بعد التحويل ابعت صورة التحويل على واتساب مع الطلب.</p></div>':'')
+'<div class="err" id="er"></div><button id="go">إرسال طلب الحجز على واتساب</button><p class="note">الحجز بيتأكد بعد رد المكان على واتساب.</p>';
var $=function(i){return document.getElementById(i)};
$('dt').value=nowLocal();$('dt').min=minLocal();
function total(){return (+TYPE[sel][2]||0)*(+$('du').value)}
function depAmt(){if(!C.d)return 0;var t=total();return C.d[0]=='f'?+C.d[1]:(t?Math.round(t*C.d[1])/100:0)}
function est(){var t=total();$('es').textContent=t?Math.round(t*100)/100+' '+cur:'-';
 if(C.d){$('dp').textContent=C.d[0]=='f'?C.d[1]+' '+cur:(t?depAmt()+' '+cur+' ('+C.d[1]+'%)':C.d[1]+'% من التكلفة');showAcc()}}
function showAcc(){var s=$('pm'),a=$('ac');if(!s||!a)return;var x=C.p[+s.value];a.innerHTML='<b>'+esc(x[1])+'</b><button type="button" id="cp">نسخ</button>';$('cp').onclick=function(){try{navigator.clipboard.writeText(x[1]);this.textContent='تم'}catch(e){}}}
$('ty').onclick=function(e){var t=e.target.closest('.t');if(!t)return;sel=+t.dataset.i;[].forEach.call(document.querySelectorAll('.t'),function(x){x.classList.toggle('on',x===t)});est()};
$('du').onchange=est;if($('pm'))$('pm').onchange=showAcc;est();
$('go').onclick=function(){
 var n=$('nm').value.trim(),p=$('ph').value.trim(),d=new Date($('dt').value),er=$('er');er.textContent='';
 if(!n)return er.textContent='اكتب اسمك.';
 if(p.replace(/\D/g,'').length<8)return er.textContent='اكتب رقم موبايل صحيح.';
 if(isNaN(d.getTime())||d.getTime()<Date.now()-60000)return er.textContent='اختار تاريخ ووقت في المستقبل.';
 var pmx=(C.d&&C.p&&C.p.length)?C.p[+$('pm').value]:null;
 var du=$('du').options[$('du').selectedIndex].text,t=TYPE[sel];
 var days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
 var when=days[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+' - '+pad(d.getHours())+':'+pad(d.getMinutes());
 var msg=['طلب حجز جديد - '+(C.n||''),'','الاسم: '+n,'الموبايل: '+p,'النوع: '+t[1],'الموعد: '+when,'المدة: '+du,'عدد الأشخاص: '+($('gs').value||'-')]
  .concat(+t[2]?['التكلفة التقريبية: '+$('es').textContent]:[]).concat(C.d?['العربون المطلوب: '+$('dp').textContent]:[]).concat(pmx?['وسيلة دفع العربون: '+pmx[0]+' ('+pmx[1]+')','سأرسل صورة التحويل هنا']:[]).concat($('nt').value.trim()?['ملاحظات: '+$('nt').value.trim()]:[]).join('\n');
 location.href='https://wa.me/'+String(C.w).replace(/\D/g,'')+'?text='+encodeURIComponent(msg)};
})();
</script></body></html>
