<title>Booking</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#000;color:#fff;font-family:"Segoe UI",Tahoma,Arial,sans-serif;display:flex;justify-content:center;padding:18px 14px 40px}
.w{width:100%;max-width:440px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lang{background:#111;color:#fff;border:1px solid #e10600;border-radius:20px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.logo{display:block;width:210px;max-width:60%;margin:6px auto 4px}
.shop{text-align:center;font-weight:700;font-size:18px;letter-spacing:.3px}
.card{margin-top:16px;background:#0d0d0d;border:1px solid #2a2a2a;border-top:3px solid #e10600;border-radius:16px;padding:18px 16px}
h1{margin:0;text-align:center;font-size:20px}
.no{text-align:center;color:#aaa;margin:4px 0 10px;font-size:15px}
.st{display:block;width:max-content;margin:0 auto 14px;padding:5px 16px;border-radius:20px;font-weight:700;font-size:14px;background:#e10600;color:#fff}
.st.now{background:#15a34a}.st.done{background:#444;color:#ddd}
.r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed #2f2f2f;font-size:16px}
.r:last-child{border-bottom:0}
.r span{color:#aaa}.r b{text-align:end;word-break:break-word}
.pay{margin-top:8px;border-top:2px solid #e10600;padding-top:6px}
.big{font-size:19px}
.ok{color:#22c55e}.due{color:#ff4d4d}
.note{margin-top:16px;text-align:center;font-weight:700;font-size:15px}
.snap{margin-top:8px;text-align:center;color:#888;font-size:12px}
.err{text-align:center;padding:30px 10px;color:#ff6b6b;font-size:17px}
</style>

  if(m){try{var a=dec(m[1]);if(Array.isArray(a)&&a.length>=10)D={shop:String(a[0]),no:String(a[1]),room:String(a[2]),kind:String(a[3]),cust:String(a[4]),ts:+a[5],mins:+a[6],total:+a[7],paid:+a[8],cur:String(a[9]),pt:+a[10]||0};if(D&&!(isFinite(D.ts)&&isFinite(D.mins)&&isFinite(D.total)&&isFinite(D.paid)))D=null}catch(e){D=null}}
}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function row(k,v,cls){var r=el('div','r');r.appendChild(el('span','',k));r.appendChild(el('b',cls||'',v));return r}
function num(n){return (Math.round(n*100)/100).toString()}
function render(){
  document.documentElement.lang=lg?'en':'ar';document.documentElement.dir=lg?'ltr':'rtl';
  document.getElementById('lang').textContent=t('sw');
  var out=document.getElementById('out');out.textContent='';
  document.getElementById('shop').textContent=D?D.shop:'';
  document.title=(D?D.shop+' - ':'')+t('title');
  if(!D){out.appendChild(el('div','err',t('bad')));return}
  var loc=lg?'en-GB':'ar-EG-u-nu-latn',d=new Date(D.ts),e=new Date(D.ts+D.mins*60000),now=Date.now();
  var dd=d.toLocaleDateString(loc,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var tf={hour:'2-digit',minute:'2-digit'};
  var tt=d.toLocaleTimeString(loc,tf)+' - '+e.toLocaleTimeString(loc,tf);
  var rest=Math.round((D.total-D.paid)*100)/100,k=KINDS[D.kind]||KINDS.reg;
  var c=el('div','card');
  c.appendChild(el('h1','',t('title')));
  c.appendChild(el('div','no',t('no')+' '+D.no));
  var st=now<D.ts?['',t('up')]:now<=D.ts+D.mins*60000?['now',t('now')]:['done',t('done')];
  c.appendChild(el('span','st '+st[0],st[1]));
  c.appendChild(row(t('room'),D.room));
  c.appendChild(row(t('type'),k[lg]));
  c.appendChild(row(t('cust'),D.cust));
  c.appendChild(row(t('date'),dd));
  c.appendChild(row(t('time'),tt));
  c.appendChild(row(t('dur'),num(D.mins)+' '+t('min')));
  var p=el('div','pay');
  p.appendChild(row(t('total'),num(D.total)+' '+D.cur));
  p.appendChild(row(t('paid'),num(D.paid)+' '+D.cur,'ok'));
  var r=row(t('rest'),rest>0?num(rest)+' '+D.cur:t('full'),(rest>0?'due':'ok')+' big');
  p.appendChild(r);c.appendChild(p);
  out.appendChild(c);
  out.appendChild(el('div','note',t('keep')));
  if(D.pt)out.appendChild(el('div','snap',t('snap')+new Date(D.pt).toLocaleString(loc,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})));
}
document.getElementById('lang').onclick=function(){lg=lg?0:1;try{localStorage.setItem('bklang',lg?'en':'ar')}catch(e){}render()};
window.addEventListener('hashchange',function(){load();render()});
load();render();
})();
</script>
</body>
</html>
