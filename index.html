<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Fast X - حسابك</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--pn:#141414;--pn2:#1c1c1c;--ln:#2c2c2c;--tx:#f4f4f4;--mu:#9a9a9a;--ac:#ff1a1a;--am:#ffb547;--ok:#3ddc84}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px "Segoe UI",Tahoma,system-ui,sans-serif;padding-bottom:96px}
header{padding:14px 16px;border-bottom:2px solid var(--ac);display:flex;gap:10px;align-items:center}
header h1{font-size:20px;margin:0;flex:1}
button{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;cursor:pointer}
.tabs{display:flex;gap:8px;padding:12px 16px}.tabs button{flex:1;padding:12px;font-weight:700}.tabs .on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;margin:12px 16px;padding:18px}
.big{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px;direction:ltr}
.lbl{color:var(--mu);text-align:center;font-size:15px}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.row.t{font-size:22px;font-weight:800;border-top:2px solid var(--ln);margin-top:6px;padding-top:12px}
.mu{color:var(--mu)}
.warn{color:var(--am)}.bad{color:#ff6b6b}.good{color:var(--ok)}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin-top:12px}.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width 1s linear}
h2{font-size:18px;color:var(--mu);margin:18px 16px 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 16px}
.it{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;color:var(--tx);font:inherit;text-align:start}
.it:active{border-color:var(--ac)}.it b{font-size:17px}.it span{color:var(--mu)}
.it .n{align-self:flex-end;background:var(--ac);color:#fff;border-radius:12px;padding:0 9px;font-weight:700}
#bar{position:fixed;inset:auto 0 0 0;background:#0d0d0d;border-top:2px solid var(--ac);padding:10px 14px;display:none;gap:10px;align-items:center}
#bar .t{flex:1}#bar button{border:0;background:var(--ac);color:#fff;font-weight:700;padding:12px 18px}
#cart{position:fixed;inset:0;background:#000d;display:none;align-items:flex-end;justify-content:center;z-index:5}
#cart .b{background:var(--pn);width:min(560px,100%);max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.ln{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}.ln span{flex:1}.ln button{width:38px;height:38px;padding:0}
input,textarea{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:10px;width:100%;resize:none}
.stars{display:flex;justify-content:center;gap:6px;direction:ltr}.stars button{font-size:36px;line-height:1;padding:2px 8px;background:none;border:0;color:#444}.stars button.on{color:var(--am)}
.send{width:100%;border:0;background:var(--ac);color:#fff;font-weight:700;padding:14px;border-radius:10px}
.msg{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9;font-size:24px;text-align:center;padding:20px}
.msg button{background:var(--ac);border:0;color:#fff;padding:12px 22px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mu);margin-inline-end:6px}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* ---- intro (same style as the cashier opening screen) + animated logo ---- */
header.hd{display:block;padding:10px 16px 12px;text-align:center;background:#000}
header.hd .top{display:flex;justify-content:space-between;align-items:center}
header.hd h1{flex:none;font-size:17px;margin:8px 0 0;letter-spacing:.3px}
#lg{background:#111;border:1px solid var(--ac);border-radius:20px;padding:6px 14px;font-size:13px}
.spw{position:relative;width:min(62vw,280px);aspect-ratio:745/255;margin:2px auto 0;direction:ltr}
.spw img{position:absolute;top:0;height:100%;width:auto;display:block;user-select:none;-webkit-user-drag:none;opacity:0}
.spw .spL{left:0}
.spw .spX{left:69.66%}
header.hd .spw img{opacity:1}
header.hd .spw .spX{filter:drop-shadow(0 0 10px #f008)}
#bsm .spw{width:min(82vw,640px);margin:0}
#bsm .spw .spL{animation:spL .7s ease-out 1.5s forwards}
#bsm .spw .spX{animation:spX 2.2s cubic-bezier(.2,.8,.2,1) .2s forwards}
@keyframes spL{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes spX{
0%{opacity:0;transform:translateX(-114.8%) scale(4.5) rotate(-40deg);filter:drop-shadow(0 0 0 #f00)}
22%{opacity:1;transform:translateX(-114.8%) scale(1) rotate(0);filter:drop-shadow(0 0 45px #f00)}
30%{transform:translateX(-114.8%) scale(1.15) rotate(0)}
38%{transform:translateX(-114.8%) scale(1) rotate(0);filter:drop-shadow(0 0 18px #f00)}
62%{opacity:1;transform:translateX(-114.8%) scale(1) rotate(360deg);filter:drop-shadow(0 0 30px #f00)}
80%,100%{opacity:1;transform:translateX(0) scale(1) rotate(360deg);filter:drop-shadow(0 0 10px #f008)}}
#bsm{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;cursor:pointer;background:radial-gradient(ellipse at center,#1c0505 0%,#000 70%);animation:bsmIn .6s ease both,bsmOut .65s ease 3.4s forwards}
@keyframes bsmIn{from{opacity:0}to{opacity:1}}
@keyframes bsmOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#bsm{display:none}.spw img{animation:none!important;opacity:1;transform:none}.spw .spX{transform:none}}
.fbd{display:flex;justify-content:center;gap:6px;margin-bottom:8px}.fbd i{width:24px;height:5px;border-radius:3px;background:var(--ln)}.fbd i.on{background:var(--ac)}.fbd i.dn{background:var(--ok)}
.fbh{margin:6px 0 10px;text-align:center;font-size:19px}.fbl{text-align:center;color:var(--mu);margin:12px 0 2px;font-size:15px}
.fbb{display:block;margin:12px auto 0;background:none;border:0;color:var(--mu);text-decoration:underline}
</style></head><body>

 sumBar()}
function sumBar(){const q=Object.values(CART).reduce((a,b)=>a+b,0),t=MN?Object.entries(CART).reduce((a,[i,n])=>a+(MN.items[i]?MN.items[i][1]*n:0),0):0;
 $('#sum').textContent=q?q+' '+T('items2')+' - '+r2(t)+' '+(MN?MN.cur:''):T('pick');$('#bar').style.display=TAB==2&&MN&&!ENDED?'flex':'none'}
function add(i){CART[i]=(CART[i]||0)+1;drawMenu()}
function dec(i){if(--CART[i]<=0)delete CART[i];drawMenu();openCart()}
function openCart(){const e=Object.entries(CART);
 $('#cl').innerHTML=e.length?e.map(([i,n])=>'<div class="ln"><span>'+esc(MN.items[i][0])+'</span><button onclick="dec('+i+')">−</button><b>'+n+'</b><button onclick="add('+i+');openCart()">+</button></div>').join(''):'<p class="mu">'+T('empty')+'</p>';
 $('#cart').style.display='flex'}
async function sendO(){const e=Object.entries(CART);if(!e.length||!MN)return;
 const o={type:'order',id:Date.now()+''+Math.floor(Math.random()*1e4),ts:Date.now(),note:$('#nt').value.trim().slice(0,200),lines:e.map(([i,n])=>({n:MN.items[i][0],c:MN.items[i][2],q:n}))};
 const b=$('#send');b.disabled=true;b.textContent='...';
 try{const r=await fetch('https://ntfy.sh/'+KEY,{method:'POST',body:JSON.stringify(o)});if(!r.ok)throw 0;
  CART={};$('#nt').value='';$('#cart').style.display='none';drawMenu();$('#okt').innerHTML=T('sent')+'<br><small style="color:var(--mu)">'+T('sent2')+'</small>';$('#ok').style.display='flex'}
 catch(x){alert(T('fail'))}
 b.disabled=false;b.textContent=T('send')}
/* feedback: step 1 service & staff, step 2 room, step 3 summary + comment; sent to the cashier through the same ntfy channel */
const FBK='fx_fb_'+KEY;let FB={sv:0,rm:0,step:1,busy:false,sent:(()=>{try{return !!localStorage.getItem(FBK)}catch(e){return false}})()};
function fbVis(){const e=$('#fb');if(e)e.style.display=(TAB==1&&KEY&&(ST||ENDED))?'':'none'}
const fbStars=(k,v)=>'<div class="stars">'+[1,2,3,4,5].map(n=>'<button type="button" class="'+(n<=v?'on':'')+'" onclick="fbStar(\''+k+'\','+n+')" aria-label="'+n+'">★</button>').join('')+'</div>';
function fbDraw(){const e=$('#fb');if(!e)return;const c=$('#fbc'),txt=c?c.value:'';
 if(FB.sent){e.innerHTML='<div style="text-align:center;font-size:20px;font-weight:700">'+T('fbThanks')+'</div>';return}
 const dots='<div class="fbd">'+[1,2,3].map(n=>'<i class="'+(n==FB.step?'on':(n<FB.step?'dn':''))+'"></i>').join('')+'</div>';
 if(FB.step==1){e.innerHTML=dots+'<h3 class="fbh">'+T('rateSv')+'</h3>'+fbStars('sv',FB.sv);return}
 if(FB.step==2){e.innerHTML=dots+'<h3 class="fbh">'+T('rateRm')+'</h3>'+fbStars('rm',FB.rm)+'<button type="button" class="fbb" onclick="fbGo(1)">'+T('back')+'</button>';return}
 e.innerHTML=dots+'<div class="fbl">'+T('rateSv')+'</div>'+fbStars('sv',FB.sv)+'<div class="fbl">'+T('rateRm')+'</div>'+fbStars('rm',FB.rm)+'<textarea id="fbc" rows="3" maxlength="300" placeholder="'+T('fbPh')+'" style="margin:10px 0"></textarea><button class="send" id="fbs" onclick="fbSend()">'+T('fbSend')+'</button>';
 $('#fbc').value=txt}
function fbGo(n){FB.step=n;fbDraw()}
function fbStar(k,n){FB[k]=n;fbDraw();if(FB.step==1&&k=='sv')setTimeout(()=>{if(FB.step==1&&FB.sv)fbGo(2)},350);else if(FB.step==2&&k=='rm')setTimeout(()=>{if(FB.step==2&&FB.rm)fbGo(3)},350)}
async function fbSend(){if(FB.busy||FB.sent)return;if(!FB.sv||!FB.rm){alert(T('fbPick'));return}
 const o={type:'feedback',id:Date.now()+''+Math.floor(Math.random()*1e4),ts:Date.now(),stars:Math.round((FB.sv+FB.rm)/2),sv:FB.sv,rm:FB.rm,comment:($('#fbc').value||'').trim().slice(0,300)};
 FB.busy=true;const b=$('#fbs');b.disabled=true;b.textContent='...';
 try{const r=await fetch('https://ntfy.sh/'+KEY,{method:'POST',body:JSON.stringify(o)});if(!r.ok)throw 0;FB.sent=true;try{localStorage.setItem(FBK,'1')}catch(e){}fbDraw()}
 catch(x){alert(T('fail'));const b2=$('#fbs');if(b2){b2.disabled=false;b2.textContent=T('fbSend')}}
 FB.busy=false}

/* live link to the cashier through ntfy */
function connect(){
 if(!KEY)return;
 const es=new EventSource('https://ntfy.sh/'+KEY+'/sse?since=12h');
 es.onopen=()=>{$('#conn .dot').className='dot on'};
 es.onerror=()=>{$('#conn .dot').className='dot'};
 es.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event!='message')return;const o=JSON.parse(m.message);if(!o||!o.type)return;
  if(o.type=='state'){ENDED=false;ST=o;draw()}
  else if(o.type=='menu'){MN=o;drawMenu()}
  else if(o.type=='ended'){ENDED=true;draw();sumBar()}}catch(e){}}}
setLang(L);connect();setInterval(draw,1000);
</script>

(function(){var b=document.getElementById('bsm');if(!b)return;
var h=document.querySelectorAll('header.hd .spw img'),o=b.querySelectorAll('img');if(h.length==2&&o.length==2){o[0].src=h[0].src;o[1].src=h[1].src}
b.addEventListener('click',function(){b.style.animation='bsmOut .4s ease forwards'});
setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b)},4500)})();
</script>
