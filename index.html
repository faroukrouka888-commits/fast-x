<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Fast X - حسابك</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--pn:#141414;--pn2:#1c1c1c;--ln:#2c2c2c;--tx:#f4f4f4;--mu:#9a9a9a;--ac:#ff1a1a;--am:#ffb547;--ok:#3ddc84}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px "Segoe UI",Tahoma,system-ui,sans-serif;padding-bottom:96px}
header{padding:14px 16px;border-bottom:2px solid var(--ac);display:flex;gap:10px;align-items:center}
header h1{font-size:20px;margin:0;flex:1}
button{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;cursor:pointer}
.tabs{display:flex;gap:8px;padding:12px 16px}.tabs button{flex:1;padding:12px;font-weight:700}.tabs .on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;margin:12px 16px;padding:18px}
.big{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px;direction:ltr}
.lbl{color:var(--mu);text-align:center;font-size:15px}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.row.t{font-size:22px;font-weight:800;border-top:2px solid var(--ln);margin-top:6px;padding-top:12px}
.mu{color:var(--mu)}
.warn{color:var(--am)}.bad{color:#ff6b6b}.good{color:var(--ok)}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin-top:12px}.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width 1s linear}
h2{font-size:18px;color:var(--mu);margin:18px 16px 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 16px}
.it{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;color:var(--tx);font:inherit;text-align:start}
.it:active{border-color:var(--ac)}.it b{font-size:17px}.it span{color:var(--mu)}
.it .n{align-self:flex-end;background:var(--ac);color:#fff;border-radius:12px;padding:0 9px;font-weight:700}
#bar{position:fixed;inset:auto 0 0 0;background:#0d0d0d;border-top:2px solid var(--ac);padding:10px 14px;display:none;gap:10px;align-items:center}
#bar .t{flex:1}#bar button{border:0;background:var(--ac);color:#fff;font-weight:700;padding:12px 18px}
#cart{position:fixed;inset:0;background:#000d;display:none;align-items:flex-end;justify-content:center;z-index:5}
#cart .b{background:var(--pn);width:min(560px,100%);max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.ln{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}.ln span{flex:1}.ln button{width:38px;height:38px;padding:0}
input{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:10px;width:100%}
.send{width:100%;border:0;background:var(--ac);color:#fff;font-weight:700;padding:14px;border-radius:10px}
.msg{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9;font-size:24px;text-align:center;padding:20px}
.msg button{background:var(--ac);border:0;color:#fff;padding:12px 22px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mu);margin-inline-end:6px}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
</style></head><body>
<header><h1 id="shop">Fast X</h1><span class="mu" id="conn"><i class="dot"></i></span><button id="lg" onclick="toggleLang()">English</button></header>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)"></button><button id="t2" onclick="tab(2)"></button></div>
<div id="v1"></div>
<div id="v2" style="display:none"><div id="m"></div></div>
<div id="bar"><div class="t" id="sum"></div><button onclick="openCart()" id="cartb"></button></div>
<div id="cart" onclick="if(event.target==this)this.style.display='none'"><div class="b">
<h3 style="margin:0 0 8px" id="ct"></h3><div id="cl"></div>
<input id="nt" style="margin:12px 0" maxlength="200">
<div style="display:flex;gap:8px"><button class="send" id="send" onclick="sendO()"></button><button onclick="document.getElementById('cart').style.display='none'" id="back"></button></div></div></div>
<div class="msg" id="ok"><div id="okt"></div><button onclick="document.getElementById('ok').style.display='none'" id="okb"></button></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round(x*100)/100;
const TX={
 ar:{time:'الوقت',menu:'المنيو',bill:'الحساب',played:'الوقت المستخدم',left:'الوقت المتبقي',over:'وقت إضافي',open:'جلسة مفتوحة (بتتحسب بالوقت الفعلي)',timed:'جلسة بوقت محدد',min:'دقيقة',timeCost:'حساب الوقت',items:'الطلبات',disc:'الخصم',total:'الإجمالي',none:'لا توجد طلبات بعد',
  minNote:'الحد الأدنى للجلسة المفتوحة',cart:'السلة',cartT:'طلبك',send:'إرسال الطلب',back:'رجوع',note:'ملاحظات (اختياري)',pick:'اختار من المنيو',empty:'السلة فاضية',
  sent:'✅ تم إرسال طلبك',sent2:'هيوصلك في أقرب وقت',again:'طلب جديد',fail:'تعذر إرسال الطلب، تأكد من الإنترنت وحاول تاني',ended:'انتهت الجلسة',ended2:'شكرًا لزيارتك ❤️',wait:'جاري تحميل بياناتك...',bad:'الرابط غير صحيح. امسح الـ QR من الإيصال مرة تانية.',cat:{Cafe:'المشروبات',Restaurant:'الأطعمة'},items2:'صنف',prepaid:'مدفوع مسبقًا',extra:'حساب الوقت الإضافي',noMenu:'المنيو مش متاح دلوقتي',lang:'English',sess:'جلستك'},
 en:{time:'Time',menu:'Menu',bill:'Bill',played:'Time used',left:'Time left',over:'Overtime',open:'Open session (billed by actual time)',timed:'Timed session',min:'min',timeCost:'Time charge',items:'Orders',disc:'Discount',total:'Total',none:'No orders yet',
  minNote:'Open session minimum',cart:'Cart',cartT:'Your order',send:'Send order',back:'Back',note:'Notes (optional)',pick:'Pick from the menu',empty:'Cart is empty',
  sent:'✅ Order sent',sent2:'It will reach you shortly',again:'New order',fail:'Could not send, check your internet and try again',ended:'Session ended',ended2:'Thank you for visiting ❤️',wait:'Loading your data...',bad:'Invalid link. Scan the receipt QR again.',cat:{Cafe:'Drinks',Restaurant:'Food'},items2:'items',prepaid:'Prepaid',extra:'Extra time charge',noMenu:'Menu not available right now',lang:'العربية',sess:'Your session'}};
let L=(()=>{try{return localStorage.getItem('fx_cust_lang')||'ar'}catch(e){return'ar'}})();
const T=k=>TX[L][k];
const KEY=((location.hash.match(/[#&]k=([a-z0-9]{8,40})/)||[])[1])||'';
let ST=null,MN=null,ENDED=false,CART={},TAB=1,SKEW=0;
function setLang(l){L=l;try{localStorage.setItem('fx_cust_lang',l)}catch(e){}document.documentElement.lang=l;document.documentElement.dir=l=='ar'?'rtl':'ltr';
 $('#t1').textContent=T('sess');$('#t2').textContent=T('menu');$('#cartb').textContent=T('cart');$('#ct').textContent=T('cartT');$('#send').textContent=T('send');$('#back').textContent=T('back');$('#nt').placeholder=T('note');$('#okb').textContent=T('again');$('#lg').textContent=T('lang');drawMenu();draw()}
function toggleLang(){setLang(L=='ar'?'en':'ar')}
function tab(n){TAB=n;$('#t1').className=n==1?'on':'';$('#t2').className=n==2?'on':'';$('#v1').style.display=n==1?'':'none';$('#v2').style.display=n==2?'':'none';$('#bar').style.display=n==2&&MN&&!ENDED?'flex':'none'}
/* same billing rules as the cashier program */
const nowMs=()=>Date.now()+SKEW;
const mins=s=>((s.acc||0)+(s.start?nowMs()-s.start:0))/60000;
function tAmt(s){const k=s.k||1;if(s.pre){const o=mins(s)-s.pre;return o>0?r2(Math.ceil(o/k)*k/60*s.r):0}
 const m=mins(s);if(!(m>0))return 0;const sg=s.sg||[],sm=sg.reduce((a,x)=>a+x.m,0),B=Math.max(s.m||60,Math.ceil(m/k)*k);
 return r2(sg.reduce((a,x)=>a+x.m/60*x.r,0)+Math.max(0,B-sm)/60*s.r)}
const hms=m=>{const s=Math.max(0,Math.floor(m*60));return[s/3600|0,s/60%60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':')};
const fm=(x,c)=>r2(x).toLocaleString(L=='ar'?'ar-EG':'en-US',{maximumFractionDigits:2})+' '+(c||(MN&&MN.cur)||'');
function draw(){
 const v=$('#v1');
 if(!KEY){v.innerHTML='<div class="card lbl">'+T('bad')+'</div>';return}
 if(ENDED){v.innerHTML='<div class="card" style="text-align:center"><div style="font-size:26px;font-weight:800">'+T('ended')+'</div><p class="mu">'+T('ended2')+'</p></div>';return}
 if(!ST){v.innerHTML='<div class="card lbl">'+T('wait')+'</div>';return}
 const s=ST,m=mins(s),sub=(s.L||[]).reduce((a,l)=>a+l[1]*l[2],0),ta=tAmt(s),d=r2((sub+ta)*(s.pct||0)/100),tot=Math.max(0,r2(sub+ta-d)),c=(MN&&MN.cur)||'';
 let h='<div class="card"><div dir="auto" style="text-align:center;unicode-bidi:plaintext;font-size:20px;font-weight:800;margin-bottom:6px">'+esc(s.n)+'</div>';
 if(s.pre){const left=s.pre-m;
  h+='<div class="lbl">'+(left>=0?T('left'):T('over'))+'</div><div class="big '+(left<0?'bad':left<5?'warn':'')+'">'+hms(Math.abs(left))+'</div>'
   +'<div class="bar"><i style="width:'+Math.max(0,Math.min(100,m/s.pre*100))+'%;background:'+(left<5?'var(--am)':'var(--ok)')+'"></i></div>'
   +'<div class="lbl" style="margin-top:8px"><span class="pill" style="background:#ffffff14">'+T('timed')+' - '+r2(s.pre)+' '+T('min')+' ('+T('prepaid')+')</span></div>';
 }else{
  h+='<div class="lbl">'+T('played')+'</div><div class="big">'+hms(m)+'</div><div class="lbl" style="margin-top:8px"><span class="pill" style="background:#ffffff14">'+T('open')+'</span></div>'
   +'<div class="lbl" style="margin-top:6px">'+T('minNote')+': '+(s.m||60)+' '+T('min')+'</div>'}
 h+='</div><div class="card"><h3 style="margin:0 0 6px">'+T('bill')+'</h3>';
 if(s.pre){if(ta>0)h+='<div class="row"><span>'+T('extra')+'</span><b>'+fm(ta,c)+'</b></div>'}
 else h+='<div class="row"><span>'+T('timeCost')+'</span><b>'+fm(ta,c)+'</b></div>';
 if((s.L||[]).length){h+='<div class="row mu"><span>'+T('items')+'</span><span></span></div>'+s.L.map(l=>'<div class="row"><span>'+l[2]+' × '+esc(l[0])+'</span><span>'+fm(l[1]*l[2],c)+'</span></div>').join('')}
 else h+='<div class="row mu"><span>'+T('none')+'</span><span></span></div>';
 if(d>0)h+='<div class="row"><span>'+T('disc')+' ('+s.pct+'%)</span><b class="good">-'+fm(d,c)+'</b></div>';
 h+='<div class="row t"><span>'+T('total')+'</span><span>'+fm(tot,c)+'</span></div></div>';
 v.innerHTML=h}
function drawMenu(){
 const el=$('#m');if(!MN){el.innerHTML='<p class="mu" style="padding:16px">'+T('noMenu')+'</p>';sumBar();return}
 $('#shop').textContent=MN.shop||'Fast X';document.title=(MN.shop||'Fast X')+' - '+T('sess');
 el.innerHTML=['Cafe','Restaurant'].map(c=>{const l=MN.items.map((x,i)=>[x,i]).filter(a=>a[0][2]==c);return l.length?'<h2>'+T('cat')[c]+'</h2><div class="g">'+l.map(([x,i])=>'<button class="it" onclick="add('+i+')"><b>'+esc(x[0])+'</b><span>'+x[1]+' '+esc(MN.cur)+'</span>'+(CART[i]?'<div class="n">'+CART[i]+'</div>':'')+'</button>').join('')+'</div>':''}).join('');
 sumBar()}
function sumBar(){const q=Object.values(CART).reduce((a,b)=>a+b,0),t=MN?Object.entries(CART).reduce((a,[i,n])=>a+(MN.items[i]?MN.items[i][1]*n:0),0):0;
 $('#sum').textContent=q?q+' '+T('items2')+' - '+r2(t)+' '+(MN?MN.cur:''):T('pick');$('#bar').style.display=TAB==2&&MN&&!ENDED?'flex':'none'}
function add(i){CART[i]=(CART[i]||0)+1;drawMenu()}
function dec(i){if(--CART[i]<=0)delete CART[i];drawMenu();openCart()}
function openCart(){const e=Object.entries(CART);
 $('#cl').innerHTML=e.length?e.map(([i,n])=>'<div class="ln"><span>'+esc(MN.items[i][0])+'</span><button onclick="dec('+i+')">−</button><b>'+n+'</b><button onclick="add('+i+');openCart()">+</button></div>').join(''):'<p class="mu">'+T('empty')+'</p>';
 $('#cart').style.display='flex'}
async function sendO(){const e=Object.entries(CART);if(!e.length||!MN)return;
 const o={type:'order',id:Date.now()+''+Math.floor(Math.random()*1e4),ts:Date.now(),note:$('#nt').value.trim().slice(0,200),lines:e.map(([i,n])=>({n:MN.items[i][0],c:MN.items[i][2],q:n}))};
 const b=$('#send');b.disabled=true;b.textContent='...';
 try{const r=await fetch('https://ntfy.sh/'+KEY,{method:'POST',body:JSON.stringify(o)});if(!r.ok)throw 0;
  CART={};$('#nt').value='';$('#cart').style.display='none';drawMenu();$('#okt').innerHTML=T('sent')+'<br><small style="color:var(--mu)">'+T('sent2')+'</small>';$('#ok').style.display='flex'}
 catch(x){alert(T('fail'))}
 b.disabled=false;b.textContent=T('send')}
/* live link to the cashier through ntfy */
function connect(){
 if(!KEY)return;
 const es=new EventSource('https://ntfy.sh/'+KEY+'/sse?since=12h');
 es.onopen=()=>{$('#conn .dot').className='dot on'};
 es.onerror=()=>{$('#conn .dot').className='dot'};
 es.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event!='message')return;const o=JSON.parse(m.message);if(!o||!o.type)return;
  if(o.type=='state'){ENDED=false;ST=o;draw()}
  else if(o.type=='menu'){MN=o;drawMenu()}
  else if(o.type=='ended'){ENDED=true;draw();sumBar()}}catch(e){}}}
setLang(L);connect();setInterval(draw,1000);
</script></body></html>
